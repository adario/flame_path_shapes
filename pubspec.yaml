name: flame_path_shapes
description: "Testbed for the proposed Flame path/shape changes"
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  flame: ^1.38.2
  flame_forge2d: ^0.20.0
  dashbook: ^0.1.18
  meta: ^1.19.0
  web: ^1.1.1

dev_dependencies:
  flame_lint: ^1.4.3
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

dependency_overrides:
  flame:
    git:
      url: https://github.com/adario/flame
      path: packages/flame
      ref: feat/path-shapes
  flame_forge2d:
    git:
      url: https://github.com/adario/flame
      path: packages/flame_forge2d
      ref: feat/path-shapes

flutter:
  uses-material-design: true

  assets:
    - assets/images/animations/
    - assets/images/
    - assets/images/tile_maps/
    - assets/images/layers/
    - assets/images/parallax/
    - assets/images/parallax/
    - assets/images/rogue_shooter/
    - assets/spine/
    - assets/svgs/
    - assets/tiles/
    - assets/audio/music/
    - assets/audio/sfx/
    - assets/yarn/

  fonts:
    - family: LEDBoard-7
      fonts:
        - asset: fonts/led_board-7.ttf
